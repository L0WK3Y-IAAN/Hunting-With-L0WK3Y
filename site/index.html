<script>
/* Phones, touch screens and anyone who chose "Simple View" get the plain site. ?desktop forces this page. */
(function () {
  try {
    if (/[?&]desktop\b/.test(location.search)) { localStorage.setItem('hwl-view', 'desktop'); return; }
    var pref = localStorage.getItem('hwl-view');
    var small = innerWidth < 900 || matchMedia('(pointer: coarse)').matches;
    if (pref === 'hub' || (pref !== 'desktop' && small)) {
      var m = location.hash.match(/^#open=(.+)$/);
      location.replace(m ? decodeURIComponent(m[1]) : 'hub/');
    }
  } catch (e) { /* storage blocked: stay on the desktop */ }
})();
</script>
